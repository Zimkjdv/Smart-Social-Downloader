</style></head><body><h1>𝕏 本機登入連接</h1><p>使用此 Chrome 個人檔案中已登入的 X。連接成功後會自動重試失敗的 X 項目。</p><details><summary>本機連接設定</summary><label for="tool-port">下載工具連接埠</label><input id="tool-port" type="number" min="1" max="65535" step="1" value="8765" required inputmode="numeric"><p>須與下載工具相同，預設為 8765。僅支援這台電腦的 127.0.0.1。</p></details><p id="target-origin"></p><a id="open-tool" href="http://127.0.0.1:8765/" target="_blank" rel="noopener">開啟本機下載工具 ↗</a><button id="connect">連接已登入的 X</button><p id="message" role="status"></p><a href="https://x.com/home" target="_blank" rel="noopener">在一般 Chrome 開啟 X</a><small>僅傳送 X 登入 Cookie 至明確設定的本機下載工具，資料以 Windows 加密保存。</small><script src="popup.js"></script></body></html>
