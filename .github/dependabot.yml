version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      action-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    groups:
      python-maintenance:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
