name: Source and download checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Check reviewed action pins
        run: python tools/check_workflows.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock.txt
      - name: Install optional browser capture on Python 3.12
        run: python -m pip install -r requirements-browser.txt
      - name: Require Chrome for browser acceptance on Python 3.12
        run: python -c "from ssdl.browser_media import available; assert available(), 'Google Chrome is required for browser acceptance'"
      - run: python -m pip check
      - run: python tools/manage.py check
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test tests/frontend.test.cjs
      - run: python tools/package_source.py --check
      - name: Test the extracted source distribution
        run: python tools/check_source_archive.py

  install-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Accept fresh Windows installation and console shutdown
        run: python tools/check_installation.py --browser --work-dir "$env:RUNNER_TEMP" --report "$env:RUNNER_TEMP/ssdl-installation.json"
