name: Windows distribution

on:
  pull_request:
    paths:
      - 'ssdl/**'
      - 'desktop/**'
      - 'static/**'
      - 'packaging/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python tools/check_workflows.py
      - name: Build fixed LGPL FFmpeg and include corresponding sources
        run: python tools/prepare_windows_ffmpeg.py --output "$RUNNER_TEMP/windows-media"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-media
          path: ${{ runner.temp }}/windows-media
          retention-days: 3
          if-no-files-found: error

  windows-package:
    needs: media-tool
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-media
          path: ${{ runner.temp }}/windows-media
      - name: Install pinned optional release dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-browser.txt -r requirements-desktop.txt -r requirements-build.txt
      - name: Build directory bundle and user installer
        run: python tools/build_windows.py --ffmpeg-dir "$env:RUNNER_TEMP/windows-media" --output "$env:RUNNER_TEMP/windows-build"
      - name: Accept real frozen process roles and persistence
        run: python tools/check_windows_distribution.py --bundle "$env:RUNNER_TEMP/windows-build/dist/SmartSocialDownloader" --report "$env:RUNNER_TEMP/windows-build/frozen-acceptance.json" --iscc "$env:GITHUB_WORKSPACE/.release-check/windows-vendor/inno-6.7.3/ISCC.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64-preview
          path: |
            ${{ runner.temp }}/windows-build/installer/*.exe
            ${{ runner.temp }}/windows-build/*.zip
            ${{ runner.temp }}/windows-build/SHA256SUMS.txt
            ${{ runner.temp }}/windows-build/frozen-acceptance.json
          retention-days: 7
          if-no-files-found: error
