name: Windows distribution

on:
  pull_request:
    paths:
      - 'ssdl/**'
      - 'desktop/**'
      - 'static/**'
      - 'packaging/**'
      - 'docs/reference/THIRD_PARTY_NOTICES.md'
      - 'tools/**'
      - 'tests/**'
      - 'requirements/**'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/check_workflows.py
      - name: Build fixed LGPL FFmpeg and include corresponding sources
        run: python tools/prepare_windows_ffmpeg.py --output "$RUNNER_TEMP/windows-media"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-media
          path: ${{ runner.temp }}/windows-media
          retention-days: 3
          if-no-files-found: error

  windows-package:
    needs: media-tool
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-media
          path: ${{ runner.temp }}/windows-media
      - name: Install pinned optional release dependencies
        run: python -m pip install -r requirements/requirements.lock.txt -r requirements/requirements-browser.txt -r requirements/requirements-desktop.txt -r requirements/requirements-build.txt
      - name: Build directory bundle and user installer
        run: python tools/build_windows.py --ffmpeg-dir "$env:RUNNER_TEMP/windows-media" --output "$env:RUNNER_TEMP/windows-build"
      - name: Accept real frozen process roles and persistence
        run: python tools/check_windows_distribution.py --bundle "$env:RUNNER_TEMP/windows-build/dist/SmartSocialDownloader" --report "$env:RUNNER_TEMP/windows-build/frozen-acceptance.json" --iscc "$env:GITHUB_WORKSPACE/.release-check/windows-vendor/inno-6.7.3/ISCC.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-preview
          path: |
            ${{ runner.temp }}/windows-build/installer/*.exe
            ${{ runner.temp }}/windows-build/*.zip
            ${{ runner.temp }}/windows-build/SHA256SUMS.txt
            ${{ runner.temp }}/windows-build/frozen-acceptance.json
          retention-days: 7
          if-no-files-found: error
